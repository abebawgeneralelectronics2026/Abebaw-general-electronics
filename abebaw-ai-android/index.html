
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABEB AW AI ASSISTANT</title>
<style>
body {
  margin: 0;
  padding: 20px;
  background: #101522;
  color: white;
  font-family: Arial, sans-serif;
}
main {
  max-width: 600px;
  margin: auto;
  text-align: center;
}
h1 { color: #d4af37; }
textarea, select {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  margin: 10px 0;
  border-radius: 9px;
  font-size: 16px;
}
button {
  padding: 13px 17px;
  margin: 6px;
  border: 0;
  border-radius: 8px;
  background: #d4af37;
  color: #101522;
  font-weight: bold;
}
#status {
  margin-top: 20px;
  color: #d4af37;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>
<main>
<h1>ABEB AW AI</h1>
<p>Your Personal Intelligent Assistant</p>

<h3>Choose Your Language</h3>
<select id="language">
<option value="en-US">English</option>
<option value="am-ET">Amharic</option>
<option value="om-ET">Afaan Oromo</option>
<option value="ar-SA">Arabic</option>
<option value="fr-FR">French</option>
<option value="sw-KE">Swahili</option>
<option value="hi-IN">Hindi</option>
<option value="es-ES">Spanish</option>
<option value="zh-CN">Chinese</option>
</select>

<h3>Talk to ABEB AW AI</h3>
<textarea id="task" placeholder="Type or speak your message..."></textarea>

<button onclick="listen()">🎤 SPEAK</button>
<button onclick="speakAnswer()">🔊 SOUND</button>

<h3>Give Me A Task</h3>
<label>
<input type="checkbox" id="approve">
I approve this task.
</label>
<br>
<button onclick="confirmTask()">CONFIRM TASK</button>
<button onclick="cancelTask()">CANCEL</button>

<p id="status">Waiting for your command...</p>
<p>AI connection and phone control are not yet connected.</p>
</main>

<script>
let answer = "Hello! I am ABEB AW AI. My voice test is ready.";

function showStatus(message) {
  answer = message;
  document.getElementById("status").textContent = message;
}

function listen() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    showStatus("Voice recognition is not supported in this browser.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = document.getElementById("language").value;
  recognition.interimResults = false;

  showStatus("Listening... Please speak.");

  recognition.onresult = function(event) {
    document.getElementById("task").value =
      event.results[0][0].transcript;
    showStatus("I heard: " + event.results[0][0].transcript);
  };

  recognition.onerror = function() {
    showStatus("I could not hear you. Please try again.");
  };

  recognition.start();
}

function speakAnswer() {
  if (!("speechSynthesis" in window)) {
    showStatus("Speech output is not supported in this browser.");
    return;
  }

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(answer);
  speech.lang = document.getElementById("language").value;
  window.speechSynthesis.speak(speech);
}

function confirmTask() {
  const task = document.getElementById("task").value.trim();

  if (!task) {
    showStatus("Please enter or speak a task first.");
    return;
  }

  if (!document.getElementById("approve").checked) {
    showStatus("Please approve this task first.");
    return;
  }

  const risky = /delete|erase|format|reset|remove|payment|send|share|permission|password|change settings/i.test(task);

  if (risky && !confirm("Important action! Do you confirm a second time?")) {
    showStatus("Task cancelled.");
    return;
  }

  showStatus("Task approved. No phone action has been performed. AI connection is still being developed.");
}

function cancelTask() {
  document.getElementById("task").value = "";
  document.getElementById("approve").checked = false;
  showStatus("Task cancelled. Waiting for your command...");
}
</script>
</body>
</html>
