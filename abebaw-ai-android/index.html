
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABEB AW AI ASSISTANT</title>
<style>
body {
  margin: 0;
  padding: 25px;
  background: #101522;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
h1 { color: #d4af37; }
textarea {
  width: 100%;
  height: 120px;
  box-sizing: border-box;
  padding: 12px;
  border-radius: 10px;
  font-size: 16px;
}
button {
  padding: 14px;
  margin: 8px;
  border: 0;
  border-radius: 8px;
  background: #d4af37;
  color: #101522;
  font-weight: bold;
}
#status { margin-top: 20px; color: #d4af37; }
</style>
</head>
<body>
<h1>ABEB AW AI</h1>
<p>Your Personal Intelligent Assistant</p>

<h3>Give Me A Task</h3>
<textarea id="task" placeholder="Tell me what you want me to do..."></textarea>

<p>
<input type="checkbox" id="approve">
I approve this task.
</p>

<button onclick="confirmTask()">CONFIRM TASK</button>
<button onclick="cancelTask()">CANCEL</button>

<p id="status">Waiting for your command...</p>

<script>
function confirmTask() {
  const task = document.getElementById("task").value.trim();
  const approved = document.getElementById("approve").checked;
  const status = document.getElementById("status");

  if (!task) {
    status.textContent = "Please enter a task first.";
    return;
  }

  if (!approved) {
    status.textContent = "Please approve the task first.";
    return;
  }

  const risky = /delete|erase|format|reset|remove|payment|send|share|permission|password/i.test(task);

  if (risky && !confirm("This task may involve an important action. Do you confirm again?")) {
    status.textContent = "Task cancelled.";
    return;
  }

  status.textContent = "Task approved. AI connection and phone control are not connected yet.";
}

function cancelTask() {
  document.getElementById("task").value = "";
  document.getElementById("approve").checked = false;
  document.getElementById("status").textContent = "Task cancelled. Waiting for your command...";
}
</script>
</body>
</html>
